# This is a Declarative Automation Bundle definition for utube_project_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: utube_project_bundle
  uuid: b4179e37-1bd4-4e3b-b6ac-0dea76827805

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: The warehouse ID to use for SQL resources

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8dbc10c8-c539.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
      warehouse_id: d9ba4f16a9b9d4bd
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-8dbc10c8-c539.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/subhadip6545@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/the_utube_project
    variables:
      catalog: youtube_prod
      schema: prod
      warehouse_id: d9ba4f16a9b9d4bd
    permissions:
      - user_name: subhadip6545@gmail.com
        level: CAN_MANAGE
